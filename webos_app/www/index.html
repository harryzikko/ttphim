<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>CineViet TV — LG webOS</title>
  <link rel="stylesheet" href="/webos/css/webos-tv.css?v=1.0.3" />
  <script src="/webos/vendor/hls.min.js"></script>
</head>
<body>
  <div id="tv-app" class="tv-root">
    <!-- Left Collapsible Sidebar Drawer (mirrors Android TV TvMainScreen) -->
    <aside id="tv-sidebar" class="tv-sidebar" aria-label="Menu điều hướng TV">
      <div class="tv-sidebar-top">
        <div class="tv-brand">
          <div class="tv-brand-badge">C</div>
          <div class="tv-brand-word">Cine<span>Viet</span></div>
        </div>
        <nav class="tv-nav" id="tv-nav">
          <button class="tv-nav-item active" data-focusable="true" data-nav="home" data-group="sidebar">
            <span class="tv-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            </span>
            <span class="tv-nav-label">Trang chủ</span>
          </button>
          <button class="tv-nav-item" data-focusable="true" data-nav="series" data-group="sidebar">
            <span class="tv-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
            </span>
            <span class="tv-nav-label">Phim bộ</span>
          </button>
          <button class="tv-nav-item" data-focusable="true" data-nav="singles" data-group="sidebar">
            <span class="tv-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>
            </span>
            <span class="tv-nav-label">Phim lẻ</span>
          </button>
          <button class="tv-nav-item" data-focusable="true" data-nav="shorts" data-group="sidebar">
            <span class="tv-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M11 21h-1l1-7H7.5c-.58 0-.57-.32-.38-.66.19-.34.05-.08.07-.12C8.48 10.94 10.42 7.54 13 3h1l-1 7h3.5c.49 0 .56.33.47.51l-.07.15C12.96 17.55 11 21 11 21z"/></svg>
            </span>
            <span class="tv-nav-label">Short Phim</span>
          </button>
          <button class="tv-nav-item" data-focusable="true" data-nav="search" data-group="sidebar">
            <span class="tv-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </span>
            <span class="tv-nav-label">Tìm kiếm</span>
          </button>
          <button class="tv-nav-item" data-focusable="true" data-nav="account" data-group="sidebar">
            <span class="tv-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </span>
            <span class="tv-nav-label">Tài khoản</span>
          </button>
        </nav>
      </div>
      <div class="tv-sidebar-user" id="tv-sidebar-user">
        <div class="tv-user-avatar" id="tv-sidebar-avatar">K</div>
        <div class="tv-user-meta">
          <div class="tv-user-name" id="tv-sidebar-name">Khách</div>
          <div class="tv-user-badge">webOS TV</div>
        </div>
      </div>
    </aside>

    <!-- Main Screen Viewport -->
    <main id="tv-stage" class="tv-stage"></main>

    <!-- Fullscreen Detail Overlay -->
    <section id="tv-detail-layer" class="tv-overlay-layer hidden" aria-hidden="true"></section>

    <!-- Fullscreen Video Player Overlay -->
    <section id="tv-player-layer" class="tv-player-layer hidden" aria-hidden="true"></section>

    <!-- Dialog Modal Layer (Continue Watching / Exit Prompt) -->
    <div id="tv-modal-layer" class="tv-modal-layer hidden" aria-hidden="true"></div>
  </div>

  <script src="/webos/js/api.js?v=1.0.3"></script>
  <script src="/webos/js/spatial.js?v=1.0.3"></script>
  <script src="/webos/js/player.js?v=1.0.3"></script>
  <script src="/webos/js/app.js?v=1.0.3"></script>
</body>
</html>
