<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1.0" />
  <title>CineViet TV — LG webOS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      background: #0B0D13;
      color: #F8FAFC;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    .splash {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 42%, rgba(229, 9, 20, 0.16), #0B0D13 62%);
    }
    .logo {
      font-size: 72px;
      font-weight: 900;
      letter-spacing: -1.5px;
      margin-bottom: 18px;
    }
    .logo span { color: #E50914; }
    .subtitle {
      color: #94A3B8;
      font-size: 24px;
      margin-bottom: 42px;
    }
    .spinner {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 4px solid rgba(255, 255, 255, 0.12);
      border-top-color: #E50914;
      animation: spin 0.9s linear infinite;
    }
    .error-box {
      display: none;
      margin-top: 28px;
      text-align: center;
      max-width: 720px;
    }
    .error-msg {
      color: #FCA5A5;
      font-size: 22px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      padding: 16px 38px;
      border-radius: 999px;
      background: #E50914;
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 700;
      border: 3px solid #FFFFFF;
      cursor: pointer;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">Cine<span>Viet</span></div>
    <div class="subtitle" id="status-text">Đang kết nối rạp phim Smart TV…</div>
    <div class="spinner" id="spinner"></div>
    <div class="error-box" id="error-box">
      <div class="error-msg" id="error-msg">Không kết nối được tới máy chủ CineViet. Vui lòng kiểm tra kết nối mạng trên TV.</div>
      <button class="btn" id="retry-btn" tabindex="0">Thử kết nối lại</button>
    </div>
  </div>
  <script>
    (function () {
      var PROD_BASE = 'https://cineviet.live/webos';
      var LOCAL_BASE = 'http://127.0.0.1:3001/webos';
      var QUERY = '/?platform=webos';
      var retryBtn = document.getElementById('retry-btn');
      var spinner = document.getElementById('spinner');
      var errorBox = document.getElementById('error-box');
      var statusText = document.getElementById('status-text');
      var busy = false;

      function showError(msg) {
        busy = false;
        spinner.style.display = 'none';
        errorBox.style.display = 'block';
        statusText.textContent = 'Mất kết nối máy chủ';
        if (msg) document.getElementById('error-msg').textContent = msg;
        retryBtn.focus();
      }

      function probeScript(probeUrl, timeoutMs, done) {
        var settled = false;
        var script = document.createElement('script');
        var timer = setTimeout(function () {
          finish(false);
        }, timeoutMs);

        function finish(ok) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          script.onload = null;
          script.onerror = null;
          if (script.parentNode) script.parentNode.removeChild(script);
          done(Boolean(ok));
        }

        window.__CINEVIET_WEBOS_READY__ = false;
        script.async = true;
        script.onload = function () {
          finish(window.__CINEVIET_WEBOS_READY__ === true);
        };
        script.onerror = function () {
          finish(false);
        };
        script.src = probeUrl + '?t=' + Date.now();
        document.body.appendChild(script);
      }

      function launch() {
        if (busy) return;
        busy = true;
        spinner.style.display = 'block';
        errorBox.style.display = 'none';
        statusText.textContent = 'Đang kết nối rạp phim Smart TV…';

        probeScript(PROD_BASE + '/probe.js', 5500, function (prodOk) {
          if (prodOk) {
            window.location.replace(PROD_BASE + QUERY);
            return;
          }
          statusText.textContent = 'Đang tìm máy chủ thử nghiệm local…';
          probeScript(LOCAL_BASE + '/probe.js', 2500, function (localOk) {
            if (localOk) {
              window.location.replace(LOCAL_BASE + QUERY);
              return;
            }
            showError('Chưa kết nối được cineviet.live/webos/ hoặc máy chủ thử nghiệm local (127.0.0.1:3001). Vui lòng kiểm tra lại và nhấn OK.');
          });
        });
      }

      retryBtn.addEventListener('click', launch);
      window.addEventListener('keydown', function (e) {
        var code = e.keyCode || e.which;
        if (code === 13) launch();
        if (code === 461 || code === 27) {
          if (window.webOS && window.webOS.platformBack) window.webOS.platformBack();
          else window.close();
        }
      });

      launch();
    })();
  </script>
</body>
</html>
