name: Build TTPhim Native Mobile App (APK & IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  BACKEND_URL: ${{ vars.BACKEND_URL || 'https://cineviet.live' }}

jobs:
  build-android:
    name: Build Android ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Mobile
            organization: com.ttphim.cinema
            target: lib/main.dart
            artifact: TTPhim-Mobile-release.apk
          - variant: AndroidTV
            organization: com.ttphim.tv
            target: lib/main_tv.dart
            artifact: TTPhim-AndroidTV-release.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Validate backend build configuration
        run: |
          python3 scripts/validate-backend-url.py
      - name: Prepare native platform
        working-directory: mobile_app
        run: |
          cp pubspec.yaml /tmp/ttphim-pubspec.yaml
          cp pubspec.lock /tmp/ttphim-pubspec.lock
          flutter create --platforms=android --org "${{ matrix.organization }}" --project-name ttphim .
          cp /tmp/ttphim-pubspec.yaml pubspec.yaml
          cp /tmp/ttphim-pubspec.lock pubspec.lock
          rm -f test/widget_test.dart
          cp config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cp config/tv_banner.xml android/app/src/main/res/drawable/tv_banner.xml
          if [ "${{ matrix.variant }}" = "Mobile" ]; then
            sed -i '/android.intent.category.LEANBACK_LAUNCHER/d' android/app/src/main/AndroidManifest.xml
          fi
          # Keep SDK levels compatible with the pinned plugin versions.
          sed -i 's/flutter.compileSdkVersion/34/g; s/flutter.minSdkVersion/21/g; s/flutter.targetSdkVersion/34/g' android/app/build.gradle
      - name: Resolve dependencies
        working-directory: mobile_app
        run: flutter pub get --enforce-lockfile
      - name: Static analysis
        working-directory: mobile_app
        run: |
          if ! flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.log; then
            echo "::error title=Flutter Analyze Failed::Static analysis reported issues"
            cat /tmp/analyze.log
            exit 1
          fi
      - name: Unit and widget tests
        working-directory: mobile_app
        run: |
          if ! flutter test --dart-define=BACKEND_URL=https://backend.test 2>&1 | tee /tmp/test.log; then
            echo "::error title=Flutter Test Failed::Unit tests failed"
            cat /tmp/test.log
            exit 1
          fi
      - name: Build sideload APK (default debug signature, no release keystore)
        working-directory: mobile_app
        run: flutter build apk --release -t "${{ matrix.target }}" --dart-define="BACKEND_URL=$BACKEND_URL"
      - name: Organize APK
        run: |
          mkdir -p output
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk "output/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: TTPhim-${{ matrix.variant }}-APK
          path: output/*.apk
          retention-days: 14

  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Validate backend build configuration
        run: |
          python3 scripts/validate-backend-url.py
      - name: Prepare native platform
        working-directory: mobile_app
        run: |
          cp pubspec.yaml /tmp/ttphim-pubspec.yaml
          cp pubspec.lock /tmp/ttphim-pubspec.lock
          flutter create --platforms=ios --org com.ttphim.cinema --project-name ttphim .
          cp /tmp/ttphim-pubspec.yaml pubspec.yaml
          cp /tmp/ttphim-pubspec.lock pubspec.lock
          rm -f test/widget_test.dart
          cp config/Info.plist ios/Runner/Info.plist
      - name: Resolve dependencies
        working-directory: mobile_app
        run: flutter pub get --enforce-lockfile
      - name: Static analysis
        working-directory: mobile_app
        run: |
          if ! flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.log; then
            echo "::error title=Flutter Analyze Failed::Static analysis reported issues"
            cat /tmp/analyze.log
            exit 1
          fi
      - name: Unit and widget tests
        working-directory: mobile_app
        run: |
          if ! flutter test --dart-define=BACKEND_URL=https://backend.test 2>&1 | tee /tmp/test.log; then
            echo "::error title=Flutter Test Failed::Unit tests failed"
            cat /tmp/test.log
            exit 1
          fi
      - name: Install iOS Pods
        working-directory: mobile_app/ios
        run: pod install --repo-update
      - name: Build iOS bundle
        working-directory: mobile_app
        run: flutter build ios --release --no-codesign --dart-define="BACKEND_URL=$BACKEND_URL"
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r mobile_app/build/ios/iphoneos/Runner.app Payload/
          find Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          find Payload -name embedded.mobileprovision -delete
          find Payload -type f -exec sh -c 'file "$1" | grep -q "Mach-O" && codesign --remove-signature "$1" 2>/dev/null || true' sh {} \;
          zip -r TTPhim-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TTPhim-iOS-IPA-Unsigned
          path: TTPhim-unsigned.ipa
          retention-days: 14
