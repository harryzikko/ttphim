name: Build TTPhim Native Mobile App (APK & IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  BACKEND_URL: ${{ vars.BACKEND_URL || 'https://cineviet.live' }}

jobs:
  build-android:
    name: Build Android ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Mobile
            organization: com.ttphim.cinema
            target: lib/main.dart
            artifact: TTPhim-Mobile-release.apk
          - variant: AndroidTV
            organization: com.ttphim.tv
            target: lib/main_tv.dart
            artifact: TTPhim-AndroidTV-release.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Validate backend build configuration
        run: |
          python3 scripts/validate-backend-url.py
      - name: Prepare native platform
        working-directory: mobile_app
        run: |
          cp pubspec.yaml /tmp/ttphim-pubspec.yaml
          cp pubspec.lock /tmp/ttphim-pubspec.lock
          flutter create --platforms=android --org "${{ matrix.organization }}" --project-name ttphim .
          cp /tmp/ttphim-pubspec.yaml pubspec.yaml
          cp /tmp/ttphim-pubspec.lock pubspec.lock
          rm -f test/widget_test.dart
          cp config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cp config/tv_banner.xml android/app/src/main/res/drawable/tv_banner.xml
          if [ "${{ matrix.variant }}" = "Mobile" ]; then
            sed -i '/android.intent.category.LEANBACK_LAUNCHER/d' android/app/src/main/AndroidManifest.xml
            sed -i '/android:banner="@drawable\/tv_banner"/d' android/app/src/main/AndroidManifest.xml
          fi
          # Upgrade Kotlin version in settings.gradle to 1.9.24 for wakelock_plus compatibility
          sed -i -E 's/id "org.jetbrains.kotlin.android" version "[^"]+"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          # Keep SDK levels compatible with the pinned plugin versions.
          sed -i 's/flutter.compileSdkVersion/34/g; s/flutter.minSdkVersion/21/g; s/flutter.targetSdkVersion/34/g' android/app/build.gradle
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' android/app/build.gradle
          sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" android/app/build.gradle
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' android/app/build.gradle
          sed -i 's/targetSdk = 34/targetSdk = 34\n        multiDexEnabled = true/g' android/app/build.gradle || true
          # Configure gradle properties for compatibility with AGP 8
          mkdir -p android
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties
          echo "android.nonTransitiveRClass=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8" >> android/gradle.properties
      - name: Inspect generated Android configs
        working-directory: mobile_app
        run: |
          echo "=== android/settings.gradle ==="
          cat android/settings.gradle
          echo "=== android/app/build.gradle ==="
          cat android/app/build.gradle
      - name: Resolve dependencies
        working-directory: mobile_app
        run: |
          flutter clean
          flutter pub get --enforce-lockfile
      - name: Static analysis
        working-directory: mobile_app
        run: |
          if ! flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.log; then
            echo "::error title=Flutter Analyze Failed::Static analysis reported issues"
            cat /tmp/analyze.log
            exit 1
          fi
      - name: Unit and widget tests
        working-directory: mobile_app
        run: |
          if ! flutter test --dart-define=BACKEND_URL=https://backend.test 2>&1 | tee /tmp/test.log; then
            echo "::error title=Flutter Test Failed::Unit tests failed"
            cat /tmp/test.log
            exit 1
          fi
      - name: Build sideload APK (default debug signature, no release keystore)
        working-directory: mobile_app
        run: |
          set -o pipefail
          if ! flutter build apk --release -v -t "${{ matrix.target }}" --dart-define="BACKEND_URL=$BACKEND_URL" 2>&1 | tee /tmp/apk-build.log; then
            python3 -c "
            with open('/tmp/apk-build.log', 'r', errors='ignore') as f:
                lines = f.readlines()
            selected_lines = []
            for i, line in enumerate(lines):
                if any(k in line for k in ['Target ', 'Exception:', 'Error:', 'Caused by:', '* What went wrong:', '#0 ']):
                    start = max(0, i - 10)
                    end = min(len(lines), i + 10)
                    for l in lines[start:end]:
                        clean_l = l.strip()
                        if clean_l and clean_l not in selected_lines:
                            selected_lines.append(clean_l)
            if not selected_lines:
                selected_lines = [l.strip() for l in lines[-30:] if l.strip()]
            msg = ' || '.join(selected_lines[:25])[:800]
            print(f'::error title=Detailed Build Failure::{msg}')
            "
            echo "::group::Full APK Build Failure Log"
            tail -n 400 /tmp/apk-build.log
            echo "::endgroup::"
            exit 1
          fi
      - name: Organize APK
        run: |
          mkdir -p output
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk "output/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: TTPhim-${{ matrix.variant }}-APK
          path: output/*.apk
          retention-days: 14

  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Validate backend build configuration
        run: |
          python3 scripts/validate-backend-url.py
      - name: Prepare native platform
        working-directory: mobile_app
        run: |
          cp pubspec.yaml /tmp/ttphim-pubspec.yaml
          cp pubspec.lock /tmp/ttphim-pubspec.lock
          flutter create --platforms=ios --org com.ttphim.cinema --project-name ttphim .
          cp /tmp/ttphim-pubspec.yaml pubspec.yaml
          cp /tmp/ttphim-pubspec.lock pubspec.lock
          rm -f test/widget_test.dart
          cp config/Info.plist ios/Runner/Info.plist
      - name: Resolve dependencies
        working-directory: mobile_app
        run: |
          flutter clean
          flutter pub get --enforce-lockfile
      - name: Static analysis
        working-directory: mobile_app
        run: |
          if ! flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.log; then
            echo "::error title=Flutter Analyze Failed::Static analysis reported issues"
            cat /tmp/analyze.log
            exit 1
          fi
      - name: Unit and widget tests
        working-directory: mobile_app
        run: |
          if ! flutter test --dart-define=BACKEND_URL=https://backend.test 2>&1 | tee /tmp/test.log; then
            echo "::error title=Flutter Test Failed::Unit tests failed"
            cat /tmp/test.log
            exit 1
          fi
      - name: Install iOS Pods
        working-directory: mobile_app/ios
        run: |
          set -o pipefail
          if ! pod install --repo-update 2>&1 | tee /tmp/pod.log; then
            echo "::error title=Pod Install Failed::$(tail -n 20 /tmp/pod.log | tr '\r\n' '  ')"
            tail -n 200 /tmp/pod.log
            exit 1
          fi
      - name: Build iOS bundle
        working-directory: mobile_app
        run: |
          set -o pipefail
          if ! flutter build ios --release --no-codesign --dart-define="BACKEND_URL=$BACKEND_URL" 2>&1 | tee /tmp/ios-build.log; then
            echo "::error title=iOS Build Failed::$(tail -n 20 /tmp/ios-build.log | tr '\r\n' '  ')"
            tail -n 200 /tmp/ios-build.log
            exit 1
          fi
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r mobile_app/build/ios/iphoneos/Runner.app Payload/
          find Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          find Payload -name embedded.mobileprovision -delete
          find Payload -type f -exec sh -c 'file "$1" | grep -q "Mach-O" && codesign --remove-signature "$1" 2>/dev/null || true' sh {} \;
          zip -r TTPhim-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TTPhim-iOS-IPA-Unsigned
          path: TTPhim-unsigned.ipa
          retention-days: 14
