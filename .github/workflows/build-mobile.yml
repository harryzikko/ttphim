name: Build TTPhim APK & IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub

jobs:
  # =============================================================
  # 1. BUILD ANDROID APK (.apk)
  # =============================================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Web Assets
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build APK (Release & Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace
          ./gradlew assembleRelease --stacktrace || true

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTPhim-Android-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          retention-days: 14

  # =============================================================
  # 2. BUILD IOS IPA (.ipa - Unsigned)
  # =============================================================
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install || true

      - name: Build iOS Archive & Export Unsigned IPA
        run: |
          cd ios/App
          xcodebuild clean -workspace App.xcworkspace -scheme App -configuration Release

          # Attempt archive without code signing, fallback to standard build if archive enforces signing
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" || \
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER=""

          # Package into Unsigned IPA (Ready for Sideloadly / AltStore / TrollStore / Scarlet)
          mkdir -p build/Payload
          if [ -d "build/App.xcarchive/Products/Applications/App.app" ]; then
            echo "Packaging App.app from xcarchive..."
            cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          elif [ -d "build/DerivedData/Build/Products/Release-iphoneos/App.app" ]; then
            echo "Packaging App.app from DerivedData..."
            cp -r build/DerivedData/Build/Products/Release-iphoneos/App.app build/Payload/
          else
            echo "Locating App.app..."
            find build -name "App.app" -type d -exec cp -r {} build/Payload/ \;
          fi

          cd build
          zip -r TTPhim-unsigned.ipa Payload
          cd ../..

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTPhim-iOS-IPA
          path: ios/App/build/TTPhim-unsigned.ipa
          retention-days: 14
