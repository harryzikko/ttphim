name: Build CineViet Native Mobile App (APK & IPA)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  BACKEND_URL: ${{ vars.BACKEND_URL || 'https://cineviet.live' }}

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android ${{ matrix.variant }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Mobile
            organization: com.cineviet.cinema
            target: lib/main.dart
            artifact: CineViet-Mobile-release.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Validate backend build configuration
        run: |
          python3 scripts/validate-backend-url.py
      - name: Prepare native platform
        working-directory: mobile_app
        run: |
          mkdir -p ~/.android
          cp config/debug.keystore ~/.android/debug.keystore
          cp pubspec.yaml /tmp/cineviet-pubspec.yaml
          rm -f pubspec.lock
          flutter create --no-pub --platforms=android --org "${{ matrix.organization }}" --project-name cineviet .
          mkdir -p android/app
          cp config/debug.keystore android/app/debug.keystore
          cp /tmp/cineviet-pubspec.yaml pubspec.yaml
          rm -f pubspec.lock
          rm -f test/widget_test.dart
          cp config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cp -r config/android/res/* android/app/src/main/res/ 2>/dev/null || true
          cp config/tv_banner.png android/app/src/main/res/drawable/tv_banner.png 2>/dev/null || true
          mkdir -p android/app/src/main/res/xml
          cp config/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          MAIN_KT=$(find android/app/src/main/kotlin -name "MainActivity.kt" | head -n 1)
          if [ -f "$MAIN_KT" ]; then
            PKG=$(grep -m 1 "^package " "$MAIN_KT" | head -n 1)
            sed "s|PACKAGE_DECLARATION|$PKG|g" config/MainActivity.kt.template > "$MAIN_KT"
          fi
          if [ "${{ matrix.variant }}" = "Mobile" ]; then
            sed -i '/android.intent.category.LEANBACK_LAUNCHER/d' android/app/src/main/AndroidManifest.xml
            sed -i '/android:banner="@drawable\/tv_banner"/d' android/app/src/main/AndroidManifest.xml
          fi
          python3 scripts/prepare_android.py
          # Configure gradle properties for compatibility with AGP 8
          mkdir -p android
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties
          echo "android.nonTransitiveRClass=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8" >> android/gradle.properties
      - name: Inspect generated Android configs
        working-directory: mobile_app
        run: |
          echo "=== android/settings.gradle ==="
          cat android/settings.gradle
          echo "=== android/app/build.gradle ==="
          cat android/app/build.gradle
      - name: Resolve dependencies
        working-directory: mobile_app
        run: |
          flutter clean
          if ! flutter pub get 2>&1 | tee /tmp/pubget.log; then
            echo "::error title=Pub Get Failed::$(tail -n 20 /tmp/pubget.log | tr '\r\n' '  ')"
            cat /tmp/pubget.log
            exit 1
          fi
      - name: Static analysis
        working-directory: mobile_app
        run: |
          if ! flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.log; then
            echo "::error title=Flutter Analyze Failed::Static analysis reported issues"
            cat /tmp/analyze.log
            exit 1
          fi
      - name: Unit and widget tests
        working-directory: mobile_app
        run: |
          if ! flutter test --dart-define=BACKEND_URL=https://backend.test 2>&1 | tee /tmp/test.log; then
            echo "::error title=Flutter Test Failed::Unit tests failed"
            cat /tmp/test.log
            exit 1
          fi
      - name: Build sideload APK (default debug signature, no release keystore)
        working-directory: mobile_app
        run: |
          set -o pipefail
          if ! flutter build apk --release --no-tree-shake-icons -t "${{ matrix.target }}" --dart-define="BACKEND_URL=$BACKEND_URL" 2>&1 | tee /tmp/apk-build.log; then
            python3 -c "
            with open('/tmp/apk-build.log', 'r', errors='ignore') as f:
                lines = f.readlines()
            err_idx = -1
            for i in range(len(lines) - 1, -1, -1):
                l = lines[i]
                if any(k in l for k in ['FontSubset', 'Tree shake', 'Target ', 'FAILURE:', 'What went wrong:', 'Execution failed for task', 'Error:', 'Exception:']):
                    err_idx = i
                    break
            if err_idx != -1:
                start = max(0, err_idx - 15)
                end = min(len(lines), err_idx + 25)
                selected = [lines[j].strip() for j in range(start, end) if lines[j].strip() and not lines[j].strip().startswith('[   +')]
                if not selected:
                    selected = [lines[j].strip() for j in range(start, end) if lines[j].strip()]
                msg = ' || '.join(selected[:25])[:850]
            else:
                msg = ' || '.join([l.strip() for l in lines[-25:] if l.strip()])[:850]
            print(f'::error title=Exact Root Cause::{msg}')
            "
            echo "::group::Full APK Build Failure Log"
            tail -n 400 /tmp/apk-build.log
            echo "::endgroup::"
            exit 1
          fi
      - name: Organize APK
        run: |
          mkdir -p output
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk "output/${{ matrix.artifact }}"
      - name: Verify APK signing key and metadata
        run: |
          EXPECTED_SHA256="707808dff819953f55f76319c2127e926915fd43874fb885bb3b9c092072a197"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name "apksigner" | sort -V | tail -n 1)
          AAPT2=$(find "$SDK_ROOT/build-tools" -name "aapt2" | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "output/${{ matrix.artifact }}" | head -n 3
          fi
          ACTUAL_SHA256=$("$APKSIGNER" verify --print-certs "output/${{ matrix.artifact }}" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print tolower($NF)}')
          echo "APK Signer SHA-256: $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=Invalid APK Signing Key::Expected $EXPECTED_SHA256 (O=TTPhim) but got $ACTUAL_SHA256"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CineViet-${{ matrix.variant }}-APK
          path: output/*.apk
          retention-days: 14

  build-android-tv:
    name: Build Native Android TV Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android TV Release APK
        working-directory: android_tv
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Organize TV APK
        run: |
          mkdir -p output
          cp android_tv/app/build/outputs/apk/release/app-release.apk output/CineViet-AndroidTV-release.apk
      - name: Verify TV APK signing key and metadata
        run: |
          EXPECTED_SHA256="707808dff819953f55f76319c2127e926915fd43874fb885bb3b9c092072a197"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name "apksigner" | sort -V | tail -n 1)
          AAPT2=$(find "$SDK_ROOT/build-tools" -name "aapt2" | sort -V | tail -n 1)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "output/CineViet-AndroidTV-release.apk" | head -n 3
          fi
          ACTUAL_SHA256=$("$APKSIGNER" verify --print-certs "output/CineViet-AndroidTV-release.apk" | grep -i "SHA-256 digest:" | head -n 1 | awk '{print tolower($NF)}')
          echo "TV APK Signer SHA-256: $ACTUAL_SHA256"
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error title=Invalid TV APK Signing Key::Expected $EXPECTED_SHA256 (O=TTPhim) but got $ACTUAL_SHA256"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CineViet-AndroidTV-release-APK
          path: output/CineViet-AndroidTV-release.apk
          retention-days: 14

  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Validate backend build configuration
        run: |
          python3 scripts/validate-backend-url.py
      - name: Prepare native platform
        working-directory: mobile_app
        run: |
          cp pubspec.yaml /tmp/cineviet-pubspec.yaml
          rm -f pubspec.lock
          flutter create --no-pub --platforms=ios --org com.cineviet.cinema --project-name cineviet .
          cp /tmp/cineviet-pubspec.yaml pubspec.yaml
          rm -f pubspec.lock
          rm -f test/widget_test.dart
          cp config/Info.plist ios/Runner/Info.plist
          python3 scripts/prepare_ios.py
      - name: Resolve dependencies
        working-directory: mobile_app
        run: |
          flutter clean
          if ! flutter pub get 2>&1 | tee /tmp/pubget.log; then
            echo "::error title=Pub Get Failed::$(tail -n 20 /tmp/pubget.log | tr '\r\n' '  ')"
            cat /tmp/pubget.log
            exit 1
          fi
      - name: Static analysis
        working-directory: mobile_app
        run: |
          if ! flutter analyze --no-fatal-infos 2>&1 | tee /tmp/analyze.log; then
            echo "::error title=Flutter Analyze Failed::Static analysis reported issues"
            cat /tmp/analyze.log
            exit 1
          fi
      - name: Unit and widget tests
        working-directory: mobile_app
        run: |
          if ! flutter test --dart-define=BACKEND_URL=https://backend.test 2>&1 | tee /tmp/test.log; then
            echo "::error title=Flutter Test Failed::Unit tests failed"
            cat /tmp/test.log
            exit 1
          fi
      - name: Install iOS Pods
        working-directory: mobile_app/ios
        run: |
          set -o pipefail
          if [ -f Podfile ]; then
            python3 ../scripts/prepare_ios.py
            if ! pod install --repo-update 2>&1 | tee /tmp/pod.log; then
              echo "::error title=Pod Install Failed::$(tail -n 20 /tmp/pod.log | tr '\r\n' '  ')"
              tail -n 200 /tmp/pod.log
              exit 1
            fi
          fi
      - name: Build iOS bundle
        working-directory: mobile_app
        run: |
          set -o pipefail
          if ! flutter build ios --release --no-codesign --no-tree-shake-icons --dart-define="BACKEND_URL=$BACKEND_URL" 2>&1 | tee /tmp/ios-build.log; then
            echo "::error title=iOS Build Failed::$(tail -n 20 /tmp/ios-build.log | tr '\r\n' '  ')"
            tail -n 200 /tmp/ios-build.log
            exit 1
          fi
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r mobile_app/build/ios/iphoneos/Runner.app Payload/
          find Payload -type d -name _CodeSignature -prune -exec rm -rf {} +
          find Payload -name embedded.mobileprovision -delete
          find Payload -type f -exec sh -c 'file "$1" | grep -q "Mach-O" && codesign --remove-signature "$1" 2>/dev/null || true' sh {} \;
          zip -r CineViet-iOS-IPA-Unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: CineViet-iOS-IPA-Unsigned
          path: CineViet-iOS-IPA-Unsigned.ipa
          retention-days: 14

  publish-release:
    name: Publish Global GitHub Release
    needs: [build-android, build-android-tv, build-ios]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.apk" -o -name "*.ipa" \) -exec cp {} release-files/ \;
          ls -la release-files/
      - name: Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "CineViet Bản Cập Nhật Mới Nhất"
          draft: false
          prerelease: false
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
