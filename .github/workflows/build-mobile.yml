name: Build TTPhim Native Mobile App (APK & IPA)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép bấm "Run workflow" thủ công trên GitHub

jobs:
  # =============================================================
  # 1. BUILD NATIVE ANDROID APK (.apk)
  # =============================================================
  build-android:
    name: Build Native Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'
          cache: true

      - name: Scaffold & Prepare Flutter App
        run: |
          # Backup our custom source code
          mkdir -p /tmp/ttphim_src
          cp -rf mobile_app/lib /tmp/ttphim_src/
          cp mobile_app/pubspec.yaml /tmp/ttphim_src/
          cp -rf mobile_app/config /tmp/ttphim_src/

          # Scaffold official Flutter platform templates
          cd mobile_app
          flutter create --org com.ttphim.cinema --project-name ttphim .

          # Apply our custom code, dependencies & Android configuration
          cp /tmp/ttphim_src/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -rf /tmp/ttphim_src/lib lib
          cp /tmp/ttphim_src/config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          # Configure Android SDK versions in local.properties
          touch android/local.properties
          echo "flutter.compileSdkVersion=34" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

          # Explicitly set SDK versions in app build.gradle / build.gradle.kts
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle* || true
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle* || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle* || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle* || true
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/g' android/app/build.gradle* || true
          sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/g' android/app/build.gradle* || true

      - name: Get Dependencies
        run: |
          cd mobile_app
          flutter pub get
          # Universal patch for any cached plugins that use flutter.compileSdkVersion without fallback
          find ~/.pub-cache -name "build.gradle*" -exec sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/g' {} + || true
          find ~/.pub-cache -name "build.gradle*" -exec sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 34/g' {} + || true

      - name: Build Android Release APK
        run: |
          cd mobile_app
          flutter build apk --release

      - name: Rename & Organize APK
        run: |
          mkdir -p output
          cp mobile_app/build/app/outputs/flutter-apk/app-release.apk output/TTPhim-v1.0.0-release.apk
          echo "Built APK successfully: output/TTPhim-v1.0.0-release.apk"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTPhim-Android-APK
          path: output/TTPhim-v1.0.0-release.apk
          retention-days: 14

  # =============================================================
  # 2. BUILD NATIVE IOS IPA (.ipa - Unsigned)
  # =============================================================
  build-ios:
    name: Build Native iOS IPA (Unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'
          cache: true

      - name: Scaffold & Prepare Flutter App
        run: |
          # Backup our custom source code
          mkdir -p /tmp/ttphim_src
          cp -rf mobile_app/lib /tmp/ttphim_src/
          cp mobile_app/pubspec.yaml /tmp/ttphim_src/
          cp -rf mobile_app/config /tmp/ttphim_src/

          # Scaffold official Flutter platform templates
          cd mobile_app
          flutter create --org com.ttphim.cinema --project-name ttphim .

          # Apply our custom code, dependencies & iOS configuration
          cp /tmp/ttphim_src/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -rf /tmp/ttphim_src/lib lib
          cp /tmp/ttphim_src/config/Info.plist ios/Runner/Info.plist

      - name: Get Dependencies & Install Pods
        run: |
          cd mobile_app
          flutter pub get
          cd ios
          pod install || pod install --repo-update || true
          cd ..

      - name: Build iOS App Bundle (No Code Sign)
        run: |
          cd mobile_app
          flutter build ios --release --no-codesign

      - name: Package into Unsigned IPA
        run: |
          mkdir -p Payload
          # Copy compiled Runner.app bundle into Payload directory
          cp -r mobile_app/build/ios/iphoneos/Runner.app Payload/
          zip -r TTPhim-v1.0.0-unsigned.ipa Payload
          echo "Packaged IPA successfully: TTPhim-v1.0.0-unsigned.ipa"

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TTPhim-iOS-IPA
          path: TTPhim-v1.0.0-unsigned.ipa
          retention-days: 14
