<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Xác Nhận Đăng Nhập Android TV - TTPHIM</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ffb4aa",
            "primary-container": "#e50914",
            "background": "#11131c",
            "surface-container": "#1d1f29",
            "surface-container-high": "#282933",
            "surface-container-highest": "#32343e",
            "on-surface": "#e1e1ef",
            "on-surface-variant": "#e9bcb6"
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/css/custom.css"/>
</head>
<body class="bg-background text-on-surface min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-surface-container rounded-2xl p-6 md:p-8 border border-white/10 shadow-2xl space-y-6 text-center relative overflow-hidden">
    <!-- Ambient Glow -->
    <div class="pointer-events-none absolute -top-16 -right-16 w-48 h-48 bg-primary-container/20 rounded-full blur-3xl"></div>

    <!-- Icon & Title -->
    <div class="flex flex-col items-center gap-3">
      <div class="w-16 h-16 rounded-2xl bg-primary-container/20 border border-primary-container/40 flex items-center justify-center text-primary-container shadow-lg">
        <span class="material-symbols-outlined text-[36px]">tv_gen</span>
      </div>
      <h1 class="font-headline-md text-2xl font-extrabold text-white">Đăng Nhập Android TV</h1>
      <p class="text-xs text-on-surface-variant">Xác nhận để liên kết tài khoản TTPHIM của bạn với ứng dụng trên TV</p>
    </div>

    <!-- Status Card -->
    <div id="auth-state-box" class="bg-surface-container-high/80 rounded-xl p-4 border border-white/5 space-y-3 text-left">
      <div class="flex items-center justify-between text-xs text-on-surface-variant">
        <span>Thiết bị yêu cầu:</span>
        <span class="font-bold text-white flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          Android TV Box / Smart TV
        </span>
      </div>

      <div class="space-y-1">
        <label class="block text-xs font-semibold text-on-surface-variant">Mã xác thực 6 số (nếu có):</label>
        <input id="tv-code-input" type="text" maxlength="6" placeholder="Ví dụ: 842913" class="w-full px-4 py-2.5 rounded-xl bg-surface-container border border-white/10 text-white font-mono text-center tracking-widest text-lg font-bold focus:outline-none focus:border-primary-container uppercase" />
      </div>

      <div id="user-info-section" class="pt-2 border-t border-white/10 hidden">
        <p class="text-xs text-on-surface-variant">Đăng nhập bằng tài khoản:</p>
        <div class="flex items-center gap-3 mt-1.5">
          <img id="user-avatar" src="" alt="Avatar" class="w-9 h-9 rounded-full object-cover border border-primary-container shrink-0" />
          <div class="min-w-0 flex-1">
            <span id="user-name" class="font-bold text-white text-sm block truncate">Người dùng</span>
            <span id="user-email" class="text-xs text-on-surface-variant block truncate">email@example.com</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="space-y-3">
      <button id="btn-confirm-tv" type="button" class="w-full py-3 rounded-xl bg-primary-container hover:bg-inverse-primary text-white font-bold text-sm tracking-wide shadow-lg shadow-primary-container/30 transition-all flex items-center justify-center gap-2 cursor-pointer">
        <span class="material-symbols-outlined text-[20px]">check_circle</span>
        <span>Xác Nhận Đăng Nhập TV</span>
      </button>

      <a href="/" class="block text-xs text-on-surface-variant hover:text-white transition-colors">
        Quay về Trang Chủ
      </a>
    </div>

    <!-- Feedback Message Box -->
    <div id="feedback-box" class="hidden p-3 rounded-xl text-xs font-semibold text-center"></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tokenFromUrl = urlParams.get('token') || '';
      const codeFromUrl = urlParams.get('code') || '';

      const codeInput = document.getElementById('tv-code-input');
      const userInfoSection = document.getElementById('user-info-section');
      const userAvatar = document.getElementById('user-avatar');
      const userName = document.getElementById('user-name');
      const userEmail = document.getElementById('user-email');
      const confirmBtn = document.getElementById('btn-confirm-tv');
      const feedbackBox = document.getElementById('feedback-box');

      if (codeFromUrl) {
        codeInput.value = codeFromUrl;
      }

      let currentUser = null;

      // Check current login state
      try {
        currentUser = await API.getMe();
        if (currentUser) {
          userInfoSection.classList.remove('hidden');
          userName.textContent = currentUser.name || 'Người dùng VIP';
          userEmail.textContent = currentUser.email || '';
          userAvatar.src = currentUser.avatar || 'https://ui-avatars.com/api/?name=User&background=e50914&color=fff';
        }
      } catch(e) {}

      confirmBtn.addEventListener('click', async () => {
        const token = tokenFromUrl;
        const code = codeInput.value.trim();

        if (!token && !code) {
          showFeedback('Vui lòng nhập mã kích hoạt 6 số hiển thị trên TV', 'error');
          return;
        }

        if (!currentUser) {
          showFeedback('Vui lòng đăng nhập tài khoản trên điện thoại trước khi xác thực TV', 'error');
          setTimeout(() => {
            window.location.href = `/dang-nhap?redirect=${encodeURIComponent(window.location.href)}`;
          }, 1500);
          return;
        }

        confirmBtn.disabled = true;
        confirmBtn.innerHTML = '<span class="w-4 h-4 rounded-full border-2 border-white border-t-transparent animate-spin"></span> Đang xác thực...';

        try {
          const res = await fetch('/api/auth/tv/authorize', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${localStorage.getItem('token') || ''}`
            },
            body: JSON.stringify({ token, code })
          });
          const json = await res.json();

          if (json.status) {
            showFeedback('🎉 Đăng nhập TV thành công! Màn hình TV sẽ tự động vào Trang Chủ.', 'success');
            confirmBtn.classList.add('hidden');
          } else {
            showFeedback(json.message || 'Mã xác thực không hợp lệ hoặc đã hết hạn', 'error');
            confirmBtn.disabled = false;
            confirmBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Thử Lại</span>';
          }
        } catch(err) {
          showFeedback('Lỗi kết nối tới máy chủ', 'error');
          confirmBtn.disabled = false;
          confirmBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span><span>Thử Lại</span>';
        }
      });

      function showFeedback(msg, type) {
        feedbackBox.classList.remove('hidden', 'bg-emerald-500/20', 'text-emerald-400', 'bg-red-500/20', 'text-red-400');
        if (type === 'success') {
          feedbackBox.classList.add('bg-emerald-500/20', 'text-emerald-400');
        } else {
          feedbackBox.classList.add('bg-red-500/20', 'text-red-400');
        }
        feedbackBox.textContent = msg;
      }

      // Auto-trigger if token is in URL and user is already logged in
      if (tokenFromUrl && currentUser) {
        confirmBtn.click();
      }
    });
  </script>
</body>
</html>
