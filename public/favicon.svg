<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#800005" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffb4aa" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 59, 48, 0.7)" />
      <stop offset="100%" stop-color="rgba(0, 238, 252, 0.4)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base -->
  <rect width="64" height="64" rx="16" fill="#0c0e17" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" />

  <!-- Modern "C" Cine Arch with Film Ribbon Cut -->
  <path d="M 43 17.5 C 38 12.5, 21 12.5, 16 21 C 11 29, 11 37, 16 44.5 C 21 52, 38 52, 43 47" 
        fill="none" 
        stroke="url(#cineGrad)" 
        stroke-width="6.5" 
        stroke-linecap="round" />

  <!-- Dynamic Play Arrow / Viet Chevron -->
  <polygon points="26,23.5 43,32.5 26,41.5" 
           fill="url(#goldGrad)" 
           filter="url(#glow)" />
  
  <!-- Cyan Cinematic Accent Point -->
  <circle cx="43" cy="18" r="2.5" fill="#00eefc" />
</svg>
