<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d" />
      <stop offset="50%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#990008" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0c0e17" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="rgba(229,9,20,0.4)" stroke-width="2" />
  <!-- CineViet Stylized "C" Symbol -->
  <path d="M42 20 C36 14, 22 15, 20 32 C18 47, 34 50, 42 44" fill="none" stroke="url(#cineGrad)" stroke-width="6.5" stroke-linecap="round" filter="url(#glow)" />
  <circle cx="43" cy="20" r="3.5" fill="#ffb4aa" filter="url(#glow)" />
</svg>
