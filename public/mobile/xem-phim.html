<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <meta content="mobile_blank" name="shell-type"/>
  <title>Đang Xem Phim - TTPhim Mobile</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#11131c" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

  <!-- HLS.js for direct video streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#11131c",
            "surface-dim": "#11131c",
            "surface-bright": "#373943",
            "surface-container-lowest": "#0c0e17",
            "surface-container-low": "#191b24",
            "surface-container": "#1d1f29",
            "surface-container-high": "#282933",
            "surface-container-highest": "#32343e",
            "on-surface": "#e1e1ef",
            "on-surface-variant": "#e9bcb6",
            "primary": "#ffb4aa",
            "primary-container": "#e50914",
            "on-primary-container": "#fff7f6",
            "secondary": "#d3fbff",
            "secondary-container": "#00eefc",
            "secondary-fixed": "#7df4ff",
            "tertiary": "#dcb8ff",
            "tertiary-container": "#9a40f2",
            "tertiary-fixed": "#efdbff"
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "2xl": "1.25rem",
            "full": "9999px"
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="/mobile/css/mobile.css" />
</head>

<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col pt-safe pb-safe">

  <!-- Main View Area -->
  <main class="flex flex-col relative w-full bg-surface min-h-screen">
    <div class="flex flex-col w-full pb-10">

      <!-- 1. VIDEO PLAYER CONTAINER (16:9 Cinema Aspect Ratio) -->
      <div id="m-player-wrapper" class="relative w-full aspect-video bg-black overflow-hidden select-none group shadow-2xl">
        <!-- Native Video Element -->
        <video id="m-video-player" class="w-full h-full object-contain hidden" playsinline webkit-playsinline></video>
        
        <!-- Iframe Embed Fallback -->
        <iframe id="m-iframe-player" class="w-full h-full border-0 hidden" allowfullscreen allow="autoplay; encrypted-media"></iframe>

        <!-- Loading Spinner -->
        <div id="m-player-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 z-30">
          <div class="w-10 h-10 rounded-full border-3 border-white/20 border-t-primary-container animate-spin"></div>
          <span class="text-xs text-white/80 mt-2 font-medium">Đang nạp luồng phát HD...</span>
        </div>

        <!-- Touch Overlay Scrim -->
        <div id="m-player-overlay" class="absolute inset-0 bg-black/40 transition-opacity duration-300 z-20 flex flex-col justify-between p-3 opacity-100">
          
          <!-- Top Overlay Controls Bar -->
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 min-w-0">
              <button aria-label="Quay lại" class="w-9 h-9 rounded-full bg-black/60 backdrop-blur-md text-white flex items-center justify-center active:scale-95" onclick="history.back()">
                <span class="material-symbols-outlined text-[20px]">arrow_back</span>
              </button>
              <div class="flex flex-col min-w-0">
                <span id="m-player-movie-name" class="font-bold text-[13px] text-white truncate leading-tight">TTPhim</span>
                <span id="m-player-ep-name" class="text-[11px] text-white/80 truncate">Tập 1</span>
              </div>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button id="m-player-cast" class="w-8 h-8 rounded-full bg-black/60 backdrop-blur-md text-white flex items-center justify-center active:scale-95">
                <span class="material-symbols-outlined text-[17px]">cast</span>
              </button>
              <button id="m-player-drawer-toggle" class="px-2.5 py-1 rounded-full bg-black/60 backdrop-blur-md text-white text-[11px] font-semibold flex items-center gap-1 active:scale-95">
                <span class="material-symbols-outlined text-[15px]">list</span>
                <span>Chọn tập</span>
              </button>
            </div>
          </div>

          <!-- Center Playback Controls -->
          <div class="flex items-center justify-center gap-8 my-auto pointer-events-auto">
            <!-- 10s Rewind -->
            <button id="m-rewind-10" class="w-10 h-10 rounded-full bg-black/50 backdrop-blur-md text-white flex items-center justify-center active:scale-90 transition-transform">
              <span class="material-symbols-outlined text-[24px]">replay_10</span>
            </button>
            <!-- Center Play/Pause -->
            <button id="m-center-play-btn" class="w-13 h-13 p-3 rounded-full bg-primary-container text-white flex items-center justify-center shadow-lg shadow-primary-container/40 active:scale-95 transition-transform">
              <span id="m-center-play-icon" class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
            </button>
            <!-- 10s Forward -->
            <button id="m-forward-10" class="w-10 h-10 rounded-full bg-black/50 backdrop-blur-md text-white flex items-center justify-center active:scale-90 transition-transform">
              <span class="material-symbols-outlined text-[24px]">forward_10</span>
            </button>
          </div>

          <!-- Bottom Scrubber & Timestamps -->
          <div class="flex flex-col gap-1.5">
            <!-- Scrubber Track -->
            <div class="relative w-full h-3 flex items-center cursor-pointer" id="m-scrubber-wrap">
              <div class="w-full h-1 bg-white/30 rounded-full overflow-hidden relative">
                <div id="m-progress-bar" class="absolute left-0 top-0 bottom-0 bg-primary-container w-0 rounded-full"></div>
              </div>
              <div id="m-scrubber-thumb" class="absolute left-0 -ml-1.5 w-3.5 h-3.5 bg-primary-container rounded-full shadow-md scale-100 transition-transform"></div>
            </div>

            <!-- Telemetry Timestamps & Controls -->
            <div class="flex items-center justify-between text-white text-[11px] font-medium">
              <div class="flex items-center gap-1.5">
                <span id="m-time-current">00:00</span>
                <span class="text-white/60">/</span>
                <span id="m-time-duration">--:--</span>
                <span class="ml-1 px-1.5 py-0.5 rounded bg-primary-container/80 text-white font-bold text-[9px]">4K HDR</span>
              </div>
              <div class="flex items-center gap-2">
                <button id="m-speed-btn" class="px-1.5 py-0.5 rounded bg-black/60 text-white text-[10px]">1.0x</button>
                <button id="m-fullscreen-btn" class="w-7 h-7 flex items-center justify-center text-white active:scale-90">
                  <span class="material-symbols-outlined text-[20px]">fullscreen</span>
                </button>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- 2. QUICK ACTIONS & SERVER SWITCHERS -->
      <div class="px-4 py-3 flex flex-col gap-2.5 bg-surface-container-low border-b border-white/5">
        <!-- Title & Badges -->
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <h1 id="m-info-title" class="font-bold text-[16px] text-on-surface truncate">...</h1>
            <p id="m-info-sub" class="text-xs text-on-surface-variant truncate">Đang phát chuẩn 4K HDR</p>
          </div>
          <button id="m-info-fav-btn" class="w-9 h-9 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface active:scale-90 shrink-0">
            <span id="m-info-fav-icon" class="material-symbols-outlined text-[20px]">bookmark_add</span>
          </button>
        </div>

        <!-- Server Stream Selectors -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pt-1">
          <span class="text-[11px] font-bold text-on-surface-variant uppercase tracking-wider shrink-0 flex items-center gap-1">
            <span class="material-symbols-outlined text-[15px] text-secondary">dns</span> Server:
          </span>
          <div id="m-watch-servers" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
            <!-- Server Pills Injected via JS -->
          </div>
        </div>
      </div>

      <!-- 3. EPISODES CAROUSEL STRIP -->
      <div class="px-4 py-3">
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-bold text-[14px] text-on-surface flex items-center gap-1.5">
            <span class="w-1.5 h-3.5 bg-primary-container rounded-full"></span>
            <span>Chọn Tập Phim</span>
          </h3>
          <span id="m-watch-ep-total" class="text-xs text-on-surface-variant"></span>
        </div>
        <div id="m-watch-ep-list" class="flex gap-2 overflow-x-auto no-scrollbar py-1">
          <!-- Horizontal episode chips injected via JS -->
        </div>
      </div>

      <!-- 4. COMMENTS & REVIEWS SECTION -->
      <div class="px-4 mt-2">
        <h3 class="font-bold text-[14px] text-on-surface mb-2.5 flex items-center gap-1.5">
          <span class="material-symbols-outlined text-[18px] text-secondary">chat_bubble</span>
          <span>Bình Luận & Thảo Luận</span>
        </h3>
        
        <!-- Post Comment Box -->
        <div class="flex items-center gap-2 mb-3 bg-surface-container rounded-full p-1.5 pl-3 border border-white/5">
          <input id="m-comment-input" class="w-full bg-transparent text-xs text-white placeholder:text-on-surface-variant/60 focus:outline-none" placeholder="Viết cảm nghĩ về tập phim..." />
          <button id="m-comment-send" class="w-8 h-8 rounded-full bg-primary-container text-white flex items-center justify-center shrink-0 active:scale-90">
            <span class="material-symbols-outlined text-[16px]">send</span>
          </button>
        </div>

        <!-- Comment List -->
        <div id="m-comment-list" class="flex flex-col gap-2.5">
          <!-- Comments injected via JS -->
        </div>
      </div>

    </div>
  </main>

  <!-- Episode Drawer Bottom Sheet -->
  <div id="epDrawerBackdrop" class="bottom-sheet-backdrop">
    <div class="bottom-sheet-content p-4 pb-safe">
      <div class="sheet-handle"></div>
      <div class="flex items-center justify-between pb-2 border-b border-white/10 mb-3">
        <h3 class="font-bold text-sm text-white flex items-center gap-1.5">
          <span class="material-symbols-outlined text-primary-container text-[18px]">playlist_play</span>
          <span>Toàn Bộ Tập Phim</span>
        </h3>
        <button id="closeEpDrawerBtn" class="w-7 h-7 rounded-full bg-surface-container flex items-center justify-center text-on-surface-variant">
          <span class="material-symbols-outlined text-[16px]">close</span>
        </button>
      </div>
      <div id="m-drawer-grid" class="grid grid-cols-4 sm:grid-cols-6 gap-2 max-h-72 overflow-y-auto no-scrollbar">
        <!-- Full episode grid -->
      </div>
    </div>
  </div>

  <!-- Mobile Scripts -->
  <script src="/js/api.js?v=2.7.2"></script>
  <script src="/mobile/js/mobile-app.js?v=1.0.0"></script>
  <script src="/mobile/js/xem-phim.js?v=1.0.0"></script>
</body>
</html>
