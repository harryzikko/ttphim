<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <linearGradient id="cineLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30" />
      <stop offset="50%" stop-color="#e50914" />
      <stop offset="100%" stop-color="#800005" />
    </linearGradient>
    <linearGradient id="goldLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffb4aa" />
    </linearGradient>
    <linearGradient id="borderLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 59, 48, 0.7)" />
      <stop offset="100%" stop-color="rgba(0, 238, 252, 0.4)" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Emblem (44x44 centered vertically) -->
  <g transform="translate(4, 6)">
    <rect width="44" height="44" rx="12" fill="#0c0e17" />
    <rect x="1" y="1" width="42" height="42" rx="11" fill="none" stroke="url(#borderLogoGrad)" stroke-width="1.5" />
    
    <!-- C Arc -->
    <path d="M 30 12 C 26 8, 15 8, 11 14 C 7 20, 7 26, 11 31 C 15 37, 26 37, 30 33" 
          fill="none" 
          stroke="url(#cineLogoGrad)" 
          stroke-width="4.8" 
          stroke-linecap="round" />

    <!-- Play Glyph -->
    <polygon points="18,16 30,22.5 18,29" 
             fill="url(#goldLogoGrad)" 
             filter="url(#logoGlow)" />

    <!-- Star Accent -->
    <circle cx="30" cy="12" r="1.8" fill="#00eefc" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(58, 35)">
    <!-- CINE in Pure White -->
    <text font-family="'Montserrat', 'Inter', -apple-system, sans-serif" 
          font-weight="900" 
          font-size="24" 
          letter-spacing="0.5" 
          fill="#ffffff">CINE</text>

    <!-- VIET in Crimson Glow -->
    <text x="64" 
          font-family="'Montserrat', 'Inter', -apple-system, sans-serif" 
          font-weight="900" 
          font-size="24" 
          letter-spacing="1" 
          fill="#e50914">VIET</text>

    <!-- Mini 4K Badge -->
    <rect x="132" y="-18" width="34" height="15" rx="3.5" fill="#e50914" opacity="0.2" />
    <rect x="132" y="-18" width="34" height="15" rx="3.5" fill="none" stroke="#e50914" stroke-width="1" />
    <text x="136" y="-7" 
          font-family="'Inter', sans-serif" 
          font-weight="800" 
          font-size="9" 
          letter-spacing="0.8" 
          fill="#ffb4aa">4K HDR</text>
  </g>

  <!-- Small Subtitle -->
  <text x="60" y="48" 
        font-family="'Inter', sans-serif" 
        font-weight="600" 
        font-size="8.5" 
        letter-spacing="2.8" 
        fill="#a0a2af">CINEMA EXPERIENCE</text>
</svg>
