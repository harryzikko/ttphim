[package]
name = "cineviet-desktop"
version = "0.1.0"
description = "CineViet Desktop App (Tauri v2 Prototype)"
authors = ["CineViet <admin@cineviet.live>"]
edition = "2021"

[lib]
name = "cineviet_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
